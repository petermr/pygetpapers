name: CI/CD Pipeline

on:
  push:
    branches: [ main, v20, develop ]
  pull_request:
    branches: [ main, v20, develop ]

env:
  PYTHON_VERSION: "3.9"

jobs:
  test-cli:
    name: Test CLI Functionality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 "black>=22.0.0" isort
        
    - name: Install pygetpapers in development mode
      run: |
        pip install -e .
        
    - name: Lint with flake8
      continue-on-error: true
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        
    - name: Check code formatting with black
      run: |
        black --check .
        
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff .
        
    - name: Run fast CI tests
      run: |
        # Run fast tests that don't make real API calls
        python tests/test_ci.py
        
        # Run unit tests only (skip integration tests that make API calls)
        pytest tests/test_extensions.py -v
        pytest tests/test_streamlit_ui.py -v
        
        # Skip test_core.py as it makes real API calls and is slow
        echo "Skipping test_core.py (integration tests) for CI speed"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  test-streamlit:
    name: Test Streamlit UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-streamlit-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-streamlit-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright
        
    - name: Install pygetpapers in development mode
      run: |
        pip install -e .
        
    - name: Install Playwright browsers
      run: |
        playwright install --with-deps
        
    # - name: Test Streamlit app imports
    #   run: |
    #     # Test that all required dependencies are available
    #     python -c "import streamlit; print('Streamlit version:', streamlit.__version__)"
    #     python -c "import plotly; print('Plotly version:', plotly.__version__)"
    #     
    #     # Test that the Streamlit app can be imported (with 30-second timeout to prevent hanging)
    #     python -c "import signal; import sys; signal.alarm(30); import streamlit_app; print('Streamlit app imported successfully')"
    #     
    # - name: Test run script
    #   run: |
    #     # Test that the run script exists and has valid syntax
    #     python -m py_compile run_streamlit.py
    #     echo "✅ Run script syntax is valid"
    #     
    #     # Test that the script can be imported (without running it - with 30-second timeout)
    #     python -c "import signal; import sys; signal.alarm(30); import run_streamlit; print('✅ Run script imported successfully')"
        
    - name: Test pygetpapers CLI availability
      run: |
        pygetpapers --version
        pygetpapers --help

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test-cli, test-streamlit]
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: dist/

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [test-cli, test-streamlit]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v20'
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme
        
    - name: Build documentation
      run: |
        # Create docs directory if it doesn't exist
        mkdir -p docs/_build
        
        # Copy Streamlit documentation to docs
        cp README_STREAMLIT.md docs/ || echo "README_STREAMLIT.md not found"
        cp -r docs/* docs/_build/ || echo "No existing docs to copy"
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run bandit security scan
      run: |
        bandit -r pygetpapers/ -f json -o bandit-report.json || true
        
    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json 