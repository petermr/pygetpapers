[upspace]
# UPSpace repository configuration
# DSpace REST API settings for University of Pretoria repository

# Required fields for pygetpapers CLI
class_name = UPSpace
library_name = upspace

# Standard pygetpapers fields
date_query = SUPPORTED
term = SUPPORTED
update = SUPPORTED
restart = NOT_SUPPORTED
features_not_supported = ["filter","synonym","onlyquery","citations","references","supp","zip"]

# Rate limiting (seconds between requests)
request_delay = 1.0

# Timeout for requests (seconds)
request_timeout = 30

# User agent string
user_agent = pygetpapers/2.0 (https://github.com/pygetpapers/pygetpapers)

# Base URL for UPSpace DSpace REST API
base_url = https://repository.up.ac.za/server/api

# Search endpoint
search_url = https://repository.up.ac.za/server/api/discover/search/objects

# Query URL for DownloadTools compatibility
query_url = https://repository.up.ac.za/server/api/discover/search/objects

# Maximum results per search
max_results = 100

# Supported languages (UPSpace is primarily English)
supported_languages = en_ZA,en_US

# XML to HTML conversion support
xml2html_supported = false
xml2html_converter = 

# File naming
file_name = upspace_result

# Content types supported
supported_content_types = html,pdf

# Metadata fields to extract
metadata_fields = title,authors,abstract,journal,year,doi,keywords,language,pdf_url,handle_url,sdg_classifications,subject_keywords,description

# Dummy entries for DownloadTools compatibility
citationurl = NOT_DEFINED
referencesurl = NOT_DEFINED
xmlurl = NOT_DEFINED
suppurl = NOT_DEFINED
zipurl = NOT_DEFINED

# SDG Classification mappings
sdg_1_no_poverty = 1
sdg_2_zero_hunger = 2
sdg_3_good_health = 3
sdg_4_quality_education = 4
sdg_5_gender_equality = 5
sdg_6_clean_water = 6
sdg_7_affordable_energy = 7
sdg_8_decent_work = 8
sdg_9_industry_innovation = 9
sdg_10_reduced_inequalities = 10
sdg_11_sustainable_cities = 11
sdg_12_responsible_consumption = 12
sdg_13_climate_action = 13
sdg_14_life_below_water = 14
sdg_15_life_on_land = 15
sdg_16_peace_justice = 16
sdg_17_partnerships = 17

# Dublin Core metadata field mappings
dc_title = title
dc_creator = authors
dc_description = abstract
dc_subject = keywords
dc_identifier = doi
dc_identifier_handle = handle_url
dc_date_issued = year
dc_language = language
dc_type = content_type
dc_rights = rights
dc_contributor = contributors
dc_publisher = publisher
dc_source = source
dc_relation = relations
dc_coverage = coverage
dc_format = format 