[repository]
name = bioRxiv
description = bioRxiv preprint repository
url = https://www.biorxiv.org/

[capabilities]
api = true
web_scraper = true
date_queries = true
text_queries = true
fulltext_download = true
pdf_download = true
metadata_export = true
csv_export = true
html_export = true

[api]
base_url = https://api.biorxiv.org/details/
endpoints = biorxiv, medrxiv
rate_limit = 1000 requests per hour
date_format = YYYY-MM-DD

[web_scraper]
base_url = https://www.biorxiv.org/
search_url = https://www.biorxiv.org/search/
pagination = true
max_papers_per_page = 25
rate_limit = 1 request per second
user_agent = Mozilla/5.0 (compatible; pygetpapers/1.0)

[download]
supported_formats = html, pdf_url
html_conversion = false
xml_conversion = false
default_output_format = html

[query_types]
text_search = true
date_range = true
author_search = false
journal_search = false
subject_search = false

[metadata_fields]
doi = true
title = true
authors = true
abstract = true
biorxiv_id = true
download_timestamp = true
file_size = true
pdf_url = true 