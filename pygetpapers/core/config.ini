[redalyc]
# Redalyc repository configuration
# Web scraping settings for Redalyc.org

# Required fields for pygetpapers CLI
class_name = Redalyc
library_name = redalyc

# Standard pygetpapers fields
date_query = NOT_SUPPORTED
term = SUPPORTED
update = SUPPORTED
restart = NOT_SUPPORTED
features_not_supported = ["pdf","startdate","enddate","filter","synonym","onlyquery","citations","references","supp","zip"]

# Rate limiting (seconds between requests)
request_delay = 1.0

# Timeout for requests (seconds)
request_timeout = 30

# User agent string
user_agent = pygetpapers/2.0 (https://github.com/pygetpapers/pygetpapers)

# Base URL for Redalyc
base_url = https://redalyc.org

# Search URL
search_url = https://redalyc.org/redalyc/search

# Dummy query_url for DownloadTools compatibility
query_url = https://redalyc.org/redalyc/search

# Maximum results per search
max_results = 100

# Supported languages (Redalyc is multilingual)
supported_languages = es,en,pt

# XML to HTML conversion support
xml2html_supported = false
xml2html_converter = 

# File naming
file_name = redalyc_result

# Content types supported
supported_content_types = html,pdf,xml

# Metadata fields to extract
metadata_fields = title,authors,abstract,journal,year,doi,keywords,language,pdf_url,xml_url

citationurl = NOT_DEFINED
referencesurl = NOT_DEFINED
xmlurl = NOT_DEFINED
suppurl = NOT_DEFINED
zipurl = NOT_DEFINED

