[repository]
name = OpenAlex
description = OpenAlex repository
url = https://openalex.org/

[capabilities]
api = true
web_scraper = false
date_queries = true
text_queries = true
fulltext_download = false
pdf_download = false
metadata_export = true
csv_export = true
html_export = false
xml_export = true

[api]
base_url = https://api.openalex.org/
endpoints = works, authors, venues, institutions
rate_limit = 100000 requests per day
date_format = YYYY-MM-DD

[download]
supported_formats = metadata_only
html_conversion = false
xml_conversion = false
default_output_format = json

[query_types]
text_search = true
date_range = true
author_search = true
journal_search = true
subject_search = true
institution_search = true

[metadata_fields]
openalex_id = true
doi = true
title = true
authors = true
abstract = true
journal = true
publication_date = true
citations = true
open_access = true 