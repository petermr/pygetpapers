[repository]
name = Europe PMC
description = Europe PubMed Central repository
url = https://europepmc.org/

[capabilities]
api = true
web_scraper = false
date_queries = true
text_queries = true
fulltext_download = true
pdf_download = true
metadata_export = true
csv_export = true
html_export = true
xml_export = true

[api]
base_url = https://www.ebi.ac.uk/europepmc/webservices/rest/
endpoints = search, fetch, citations
rate_limit = 1000 requests per hour
date_format = YYYY-MM-DD

[download]
supported_formats = xml, pdf, supplementary, fulltext_html
html_conversion = true
xml_conversion = true
default_output_format = xml

[query_types]
text_search = true
date_range = true
author_search = true
journal_search = true
subject_search = true
citations = true

[metadata_fields]
pmid = true
pmcid = true
doi = true
title = true
authors = true
abstract = true
journal = true
publication_date = true
citations = true
references = true 