# Pygetpapers Generic Web Scraping Configuration
# This file demonstrates how to configure web scraping for different repositories

[repositories]
# List of available web scraping repositories
available = biorxiv_web, medrxiv_web, arxiv_web, custom_repo

# =============================================================================
# BioRxiv Web Search Configuration
# =============================================================================

[biorxiv_web]
name = BioRxiv Web Search
description = Web-based search for bioRxiv preprints with text query support
base_url = https://www.biorxiv.org
search_url = https://www.biorxiv.org/search/{query}
enabled = true
rate_limit = 2.0  # seconds between requests
max_requests_per_minute = 30
user_agent = pygetpapers-web-scraper/1.0
respect_robots_txt = true
timeout = 30
max_retries = 3

[biorxiv_web.search]
# Search page configuration
method = GET
query_parameter = query
encoding = url_encode
pagination = true
results_per_page = 20
sort_options = relevance, date, title

[biorxiv_web.selectors]
# HTML selectors for data extraction (with fallbacks)
results_container = div.search-results, main, div.content, #main-content
paper_entry = article.paper, div.result, div.entry, .search-result
title = h1.title, h2.title, h3.title, a.title, .paper-title, [data-title]
authors = div.authors, span.author, div.author-list, .author-list, [data-authors]
doi = a[href*="doi.org"], span.doi, div.doi, .doi, [data-doi]
publication_date = time.date, span.date, div.date, .publication-date, [data-date]
abstract = div.abstract, p.abstract, section.abstract, .abstract-text
subject_area = span.subject, div.category, span.category, .subject-area
article_type = span.type, div.article-type, span.article-type, .article-type
pdf_link = a[href*=".pdf"], a.pdf-link, a.full-text, .pdf-download

[biorxiv_web.pagination]
# Pagination configuration
container = nav.pagination, div.pagination, .pagination-controls
next_button = a.next, a[rel="next"], a:contains("Next"), .next-page
previous_button = a.previous, a[rel="prev"], a:contains("Previous"), .prev-page
current_page = span.current, a.active, span.active, .current-page
page_numbers = a.page-number, span.page, .page-link
max_pages = 50  # safety limit

[biorxiv_web.filters]
# Available filters
subject_area = true
article_type = true
date_range = true
author = false
collection = true

[biorxiv_web.transformations]
# Data cleaning and transformation rules
title = strip_whitespace, remove_html_tags, normalize_quotes
authors = split_by_comma, strip_whitespace, remove_affiliations, normalize_names
publication_date = parse_date, format_iso, extract_year
doi = extract_doi_from_url, normalize_doi, validate_doi
abstract = strip_whitespace, remove_html_tags, truncate_500
subject_area = strip_whitespace, normalize_case, split_by_semicolon

[biorxiv_web.error_handling]
# Error handling and retry configuration
max_retries = 3
retry_delay = 5.0
exponential_backoff = true
skip_failed_papers = true
log_errors = true
continue_on_error = true

[biorxiv_web.output]
# Output format configuration
format = pygetpapers_json
metadata_fields = title, authors, doi, publication_date, abstract, subject_area, article_type
required_fields = title, doi
optional_fields = authors, publication_date, abstract, subject_area, article_type
output_encoding = utf-8

