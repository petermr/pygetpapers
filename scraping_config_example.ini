# =============================================================================
# arXiv Web Search Configuration (Example)
# =============================================================================

[arxiv_web]
name = arXiv Web Search
description = Web-based search for arXiv papers
base_url = https://arxiv.org
search_url = https://arxiv.org/search/?query={query}&searchtype=all&source=header
enabled = false  # Disabled by default, enable when needed
rate_limit = 3.0
max_requests_per_minute = 20
user_agent = pygetpapers-web-scraper/1.0
respect_robots_txt = true
timeout = 30
max_retries = 3

[arxiv_web.search]
method = GET
query_parameter = query
encoding = url_encode
pagination = true
results_per_page = 25
sort_options = relevance, submitted_date, last_updated_date

[arxiv_web.selectors]
results_container = div.content, main, #content
paper_entry = li.arxiv-result, div.result, .arxiv-result
title = p.title, h3.title, a.title, .title
authors = p.authors, div.authors, .authors
arxiv_id = span.arxiv-id, .arxiv-id, [data-arxiv-id]
publication_date = p.is-size-7, span.date, .submission-date
abstract = span.abstract-full, p.abstract, .abstract
subject_categories = div.list-title, .categories, .subject-categories
pdf_link = a[href*=".pdf"], a.pdf-link, .pdf-download

[arxiv_web.pagination]
container = nav.pagination, .pagination
next_button = a.next, a[rel="next"], a:contains("Next")
previous_button = a.previous, a[rel="prev"], a:contains("Previous")
current_page = span.current, .current-page
page_numbers = a.page-number, .page-link
max_pages = 100

[arxiv_web.filters]
subject_category = true
date_range = true
author = true
title_only = true
abstract_only = true

[arxiv_web.transformations]
title = strip_whitespace, remove_html_tags, normalize_quotes
authors = split_by_comma, strip_whitespace, normalize_names
publication_date = parse_date, format_iso, extract_year
arxiv_id = normalize_arxiv_id, validate_arxiv_id
abstract = strip_whitespace, remove_html_tags, truncate_500
subject_categories = strip_whitespace, split_by_space, normalize_categories

[arxiv_web.error_handling]
max_retries = 3
retry_delay = 5.0
exponential_backoff = true
skip_failed_papers = true
log_errors = true
continue_on_error = true

[arxiv_web.output]
format = pygetpapers_json
metadata_fields = title, authors, arxiv_id, publication_date, abstract, subject_categories
required_fields = title, arxiv_id
optional_fields = authors, publication_date, abstract, subject_categories
output_encoding = utf-8

# =============================================================================
# Custom Repository Template
# =============================================================================

[custom_repo]
name = Custom Repository
description = User-defined repository configuration
base_url = https://example.com
search_url = https://example.com/search?q={query}
enabled = false
rate_limit = 1.0
max_requests_per_minute = 60
user_agent = pygetpapers-web-scraper/1.0
respect_robots_txt = true
timeout = 30
max_retries = 3

[custom_repo.search]
method = GET
query_parameter = q
encoding = url_encode
pagination = true
results_per_page = 10

[custom_repo.selectors]
# Define selectors for the custom repository
results_container = div.results, main, .content
paper_entry = article, div.paper, .result
title = h1.title, h2.title, h3.title, .title
authors = div.authors, .author, .author-list
doi = a[href*="doi.org"], .doi, [data-doi]
publication_date = time.date, .date, [data-date]

[custom_repo.pagination]
container = nav.pagination, .pagination
next_button = a.next, a[rel="next"]
previous_button = a.previous, a[rel="prev"]
current_page = span.current, .current
page_numbers = a.page, .page-link

[custom_repo.filters]
subject_area = false
article_type = false
date_range = false
author = false

[custom_repo.transformations]
title = strip_whitespace, remove_html_tags
authors = strip_whitespace
publication_date = parse_date
doi = normalize_doi

[custom_repo.error_handling]
max_retries = 3
retry_delay = 5.0
exponential_backoff = true
skip_failed_papers = true
log_errors = true
continue_on_error = true

[custom_repo.output]
format = pygetpapers_json
metadata_fields = title, authors, doi, publication_date
required_fields = title
optional_fields = authors, doi, publication_date
output_encoding = utf-8

# =============================================================================
# Global Settings
# =============================================================================

[global]
# Global settings for all web scraping repositories
default_rate_limit = 2.0
default_timeout = 30
default_max_retries = 3
default_user_agent = pygetpapers-web-scraper/1.0
respect_robots_txt = true
log_level = INFO
log_file = pygetpapers_scraping.log
cache_enabled = true
cache_duration = 3600  # 1 hour
max_concurrent_requests = 5

[global.transformations]
# Global transformation functions available to all repositories
strip_whitespace = true
remove_html_tags = true
normalize_quotes = true
split_by_comma = true
normalize_names = true
parse_date = true
format_iso = true
extract_year = true
extract_doi_from_url = true
normalize_doi = true
validate_doi = true
truncate_500 = true
normalize_case = true
split_by_semicolon = true
remove_affiliations = true

[global.error_handling]
# Global error handling settings
default_max_retries = 3
default_retry_delay = 5.0
exponential_backoff = true
skip_failed_papers = true
log_errors = true
continue_on_error = true
max_errors_before_stop = 10 