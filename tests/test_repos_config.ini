[test_repositories]
# Configuration for skipping repository-specific tests
# Set to 'true' or '1' to skip tests for that repository
# Set to 'false' or '0' to run tests for that repository

# Skip Redalyc tests by default (requires network connectivity)
skip_redalyc = true

# Skip SciELO tests by default (requires network connectivity)
skip_scielo = true

# Skip BioRxiv tests by default (requires network connectivity)
skip_biorxiv = true

# Skip Upspace tests by default (requires network connectivity)
skip_upspace = true

# Note: You can also use pytest markers to override:
#   pytest -m "not redalyc"  # Skip Redalyc tests via command line
