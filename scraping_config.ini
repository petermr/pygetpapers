# Pygetpapers Generic Web Scraping Configuration
# This file configures web scraping repositories for pygetpapers

[repositories]
# List of available web scraping repositories
available = biorxiv_web, medrxiv_web, arxiv_web, custom_repo

# =============================================================================
# BioRxiv Web Search Configuration
# =============================================================================

[biorxiv_web]
name = BioRxiv Web Search
description = Web-based search for bioRxiv preprints with text query support
base_url = https://www.biorxiv.org
search_url = https://www.biorxiv.org/search/{query}
enabled = true
rate_limit = 2.0
max_requests_per_minute = 30
user_agent = pygetpapers-web-scraper/1.0
respect_robots_txt = true
timeout = 30
max_retries = 3

[biorxiv_web.search]
method = GET
query_parameter = query
encoding = url_encode
pagination = true
results_per_page = 20

[biorxiv_web.selectors]
results_container = div.search-results, main, div.content
paper_entry = article, div.search-result, div.paper
title = h1.title, h2.title, h3.title, a.title, .highwire-cite-title
authors = div.highwire-cite-authors, span.author, div.author-list, .highwire-cite-author
doi = a[href*="doi.org"], span.doi, div.doi, .highwire-cite-doi
publication_date = time.date, span.date, div.date, .highwire-cite-date
abstract = div.abstract, p.abstract, .highwire-cite-abstract
journal = span.journal, div.journal, .highwire-cite-journal

[biorxiv_web.pagination]
container = nav.pagination, div.pagination, .pager
next_button = a.next, a[rel="next"], .pager-next
previous_button = a.previous, a[rel="prev"], .pager-previous
current_page = span.current, .current, .pager-current
page_numbers = a.page, .page-link, .pager-item

[biorxiv_web.filters]
subject_area = false
article_type = false
date_range = false
author = false

[biorxiv_web.transformations]
title = strip_whitespace, remove_html_tags
authors = strip_whitespace, normalize_author_name
publication_date = parse_date
doi = normalize_doi
abstract = strip_whitespace, remove_html_tags

[biorxiv_web.error_handling]
max_retries = 3
retry_delay = 5.0
exponential_backoff = true
skip_failed_papers = true
log_errors = true
continue_on_error = true

[biorxiv_web.output]
format = pygetpapers_json
metadata_fields = title, authors, doi, publication_date, abstract
required_fields = title
optional_fields = authors, doi, publication_date, abstract
output_encoding = utf-8

