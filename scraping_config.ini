# =============================================================================
# arXiv Web Search Configuration
# =============================================================================

[arxiv_web]
name = arXiv Web Search
description = Web-based search for arXiv papers with text query support
base_url = https://arxiv.org
search_url = https://arxiv.org/search/?query={query}
enabled = false
rate_limit = 3.0
max_requests_per_minute = 20
user_agent = pygetpapers-web-scraper/1.0
respect_robots_txt = true
timeout = 30
max_retries = 3

[arxiv_web.search]
method = GET
query_parameter = query
encoding = url_encode
pagination = true
results_per_page = 25

[arxiv_web.selectors]
results_container = div.content, main, #content
paper_entry = li.arxiv-result, div.result, article
title = p.title, h1.title, a.title, .title
authors = p.authors, div.authors, .authors
doi = a[href*="doi.org"], span.doi, .doi
publication_date = p.is-size-7, span.date, .date
abstract = span.abstract-fullword, p.abstract, .abstract
arxiv_id = p.list-title, a[href*="/abs/"], .arxiv-id

[arxiv_web.pagination]
container = nav.pagination, .pagination
next_button = a.next, a[rel="next"], .pager-next
previous_button = a.previous, a[rel="prev"], .pager-previous
current_page = span.current, .current
page_numbers = a.page, .page-link

[arxiv_web.filters]
subject_area = true
article_type = true
date_range = true
author = true

[arxiv_web.transformations]
title = strip_whitespace, remove_html_tags
authors = strip_whitespace, normalize_author_name
publication_date = parse_date
doi = normalize_doi
abstract = strip_whitespace, remove_html_tags
arxiv_id = strip_whitespace

[arxiv_web.error_handling]
max_retries = 3
retry_delay = 5.0
exponential_backoff = true
skip_failed_papers = true
log_errors = true
continue_on_error = true

[arxiv_web.output]
format = pygetpapers_json
metadata_fields = title, authors, doi, publication_date, abstract, arxiv_id
required_fields = title, arxiv_id
optional_fields = authors, doi, publication_date, abstract
output_encoding = utf-8

# =============================================================================
# Global Configuration
# =============================================================================

[global]
default_rate_limit = 2.0
default_timeout = 30
default_max_retries = 3
cache_duration = 3600
max_concurrent_requests = 5
log_level = INFO
enable_debug = false

[global.transformations]
default_text_cleanup = strip_whitespace, remove_html_tags
default_date_parsing = parse_date
default_url_normalization = normalize_url

[global.error_handling]
default_max_retries = 3
default_retry_delay = 5.0
default_exponential_backoff = true
default_skip_failed_papers = true
default_log_errors = true
default_continue_on_error = true 